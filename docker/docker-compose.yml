version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwaszx1325
      POSTGRES_DB: mirco_mart_DB
    ports:
      - "5434:5432"
    volumes:
      - ./init-multiple-db.sql:/docker-entrypoint-initdb.d/init-multiple-db.sql
    networks:
      - backend

  # Jaeger 全功能服務
  jaeger:
    image: jaegertracing/all-in-one:1.46
    container_name: jaeger
    ports:
      - "6831:6831/udp"   # 接收 jaeger.thrift 格式的 spans (UDP)
      - "6832:6832/udp"   # 接收 jaeger.thrift 格式的 spans (UDP)
      - "5778:5778"       # 服務配置
      - "16686:16686"     # Jaeger UI
      - "4317:4317"       # OTLP gRPC 接收器
      - "4318:4318"       # OTLP HTTP 接收器
      - "14250:14250"     # 接收 model.proto 格式的 spans (gRPC)
      - "14268:14268"     # 接收 jaeger.thrift 格式的 spans (HTTP)
      - "9411:9411"       # Zipkin 兼容 API
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - backend

networks:
  backend: