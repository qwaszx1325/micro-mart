syntax = "proto3";

package transaction;

option go_package = "/transaction";

// TransactionService provides distributed transaction orchestration
service TransactionService {
  // RegisterUser orchestrates the user registration transaction
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse) {}
}

// RegisterUserRequest represents a user registration request
message RegisterUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

// RegisterUserResponse represents a user registration response
message RegisterUserResponse {
  UserInfo user_info = 1;
  AuthInfo auth_info = 2;
}

// UserInfo contains user information
message UserInfo {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
}

// AuthInfo contains authentication information
message AuthInfo {
  string access_token = 1;
  string refresh_token = 2;
}