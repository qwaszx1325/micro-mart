syntax = "proto3";

package user;

option go_package = "/user";

service UserService{
    rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
}

message CreateUserRequest{
    string email = 1;
    string name = 2;
    string password = 3;
}

message CreateUserResponse{
    string id = 1;
    string email = 2;
    string name = 3;
}